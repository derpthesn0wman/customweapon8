name: Build plugin jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: CustomWeapons
          path: target/CustomWeapons.jar
